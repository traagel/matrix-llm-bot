[project]
name = "matrix-llm-bot"
version = "0.3.1"
description = "Matrix chat bot that forwards messages to a local Ollama instance for LLM inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "matrix-nio>=0.25.2",
]

[project.scripts]
matrix-llm-bot = "matrix_llm_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_llm_bot"]
