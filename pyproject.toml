[project]
name = "matrix-llm-bot"
version = "0.9.0"
description = "Matrix chat bot that forwards messages to a local Ollama instance for LLM inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "kubernetes-asyncio>=35.0.1",
    "matrix-nio>=0.25.2",
]

[project.scripts]
matrix-llm-bot = "matrix_llm_bot.__main__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_llm_bot"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["matrix_llm_bot"]
